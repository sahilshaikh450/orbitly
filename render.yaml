services:
  - type: web
    name: orbitly-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn lifeos.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: DEBUG, value: "0"}
      - {key: NUM_PROXIES, value: "1"}
      - {key: SECRET_KEY, generateValue: true}
      - {key: DATABASE_URL, sync: false}
      - {key: CORS_ALLOWED_ORIGINS, sync: false}
      - {key: FRONTEND_URL, sync: false}
      - {key: BREVO_API_KEY, sync: false}
      - {key: DEFAULT_FROM_EMAIL, sync: false}
      - {key: ADMIN_URL, value: manage-orbitly-x7k2/}
